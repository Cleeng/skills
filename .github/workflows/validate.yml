name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Agent Skills spec
        run: for dir in skills/*/; do npx --yes skills-ref@0.1.5 validate "$dir"; done
      - name: Repo rules
        run: python3 scripts/validate_skills.py
      - name: Script tests
        run: python3 -m unittest discover -s tests -v
