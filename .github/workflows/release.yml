name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package each skill as .zip and .skill
        run: |
          mkdir dist
          for dir in skills/*/; do
            name=$(basename "$dir")
            (cd skills && zip -r "../dist/$name.zip" "$name" -x '*/__pycache__/*')
            cp "dist/$name.zip" "dist/$name.skill"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.skill --title "$GITHUB_REF_NAME" --generate-notes
